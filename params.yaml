## Input options
input                               : null
platform                            : null  # Options: "10X", "Argentag", "Parse"
outdir                              : null

## References
genome                              : null
genome_fasta                        : null
transcript_fasta                    : null
gtf                                 : null
igenomes_base                       : 's3://ngi-igenomes/igenomes/'
igenomes_ignore                     : true
fasta_delimiter                     : ""

## Fastq Options
split_amount                        : 0

## Read Trimming Options
min_length                          : 1
min_q_score                         : 10
skip_trimming                       : false

## 10X cell barcode options
whitelist                           : null
barcode_format                      : null  # Options: "10X_3v3", "10X_3v4", "10X_5v2", "10X_5v3"

## Parse related options
parse_generate_pe                   : "--chemistry v3 --l1dist 3 --l2dist 2"
parse_spipe                         : "--chemistry v3 --kit WT_mini"

## Argentag related options
argentag_taggy_demux                : "--out-fmt='flames' --trim-TSO --preserve --trim-poly 'normal' --orient 'sense' --keep-failed"

## Library strandness option
stranded                            : null

## Mapping
skip_save_minimap2_index            : false
kmer_size                           : 14

## Deduplication
dedup_tool                          : 'umitools'  # Options: "umitools", "picard"

## Analysis options
retain_introns                      : true
quantifier                          : ''

## Skipping options:
skip_qc                             : false
skip_seurat                         : false
skip_nanoplot                       : false
skip_toulligqc                      : false
skip_fastqc                         : false
skip_bam_nanocomp                   : false

## MultiQC options:
multiqc_config                      : null
multiqc_logo                        : null
